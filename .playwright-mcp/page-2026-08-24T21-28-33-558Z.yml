    - img "Pulse health tracking app on a mobile phone" [ref=f1e22]
    - generic [ref=f1e23]:
      - generic [ref=f1e24]:
        - paragraph [ref=f1e25]: Pulse asked me to rework their core logging flow after user research showed most people stopped tracking within the first two weeks. The original flow required six taps to log a single meal, and the interface leaned heavily on data density over clarity. I rebuilt the flow around a single home screen with quick-add gestures, cutting the average logging time from 40 seconds to under 10.
        - paragraph [ref=f1e26]: I worked closely with the two founding engineers to make sure every interaction translated cleanly into SwiftUI, prototyping key transitions in ProtoPie before handoff so motion timing was locked before development started. The result shipped in under six weeks from first wireframe to App Store release.
